services:
  # Spring Boot Backend Service
  - type: web
    name: campus-hub-backend
    env: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/LostAndFound-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DB_URL
        value: jdbc:mysql://thomas.proxy.rlwy.net:36382/railway?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: xgYiqMHiGHBwHaXqmjOPygePdcBuEAoG
      - key: GEMINI_API_KEY
        value: your_gemini_api_key_here
      - key: CLOUDINARY_CLOUD_NAME
        value: your_cloud_name
      - key: CLOUDINARY_API_KEY
        value: your_api_key
      - key: CLOUDINARY_API_SECRET
        value: your_api_secret
      - key: JWT_SECRET
        value: a_very_long_and_random_secret_key_for_jwt_that_is_at_least_256_bits
      - key: MAIL_USERNAME
        value: your_email@gmail.com
      - key: MAIL_PASSWORD
        value: your_gmail_app_password
      - key: RAZORPAY_KEY_ID
        value: rzp_test_YourKeyId
      - key: RAZORPAY_KEY_SECRET
        value: YourKeySecret

  # React Frontend Service
  - type: web
    name: campus-hub-frontend
    env: node
    plan: free
    rootDir: campus-hub-frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_BASE_URL
        value: https://${campus-hub-backend.onrender.com}/api
